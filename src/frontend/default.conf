server {
  listen 8080;
  server_name localhost;
  server_tokens off;

  root /usr/share/nginx/html;
  
  location ^~ /assets/mediapipe/wasm/ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Serve static files with caching
  location ~* ^/assets/.*\.(css|js|json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      expires 30d;
      add_header Cache-Control "public, max-age=2592000";
  }

  # Proxy Mastrao secure handoff forms to Django while keeping room pages on the SPA.
  location ^~ /handoff/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $mastrao_backend http://app-dev:8000;
      proxy_pass $mastrao_backend;
      proxy_set_header Host $host;
      # The public Gateway has already removed client-supplied forwarding
      # headers and rebuilt these values from the trusted transport.
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Original-URL "";
      proxy_set_header X-Real-IP "";
  }

  # These endpoints trust X-Original-URL and are internal auth subrequests.
  # Exact public requests must never fall through to Django or the SPA.
  location = /api/v1.0/recordings/media-auth {
      return 404;
  }

  location = /api/v1.0/recordings/media-auth/ {
      return 404;
  }

  location = /api/v1.0/files/media-auth {
      return 404;
  }

  location = /api/v1.0/files/media-auth/ {
      return 404;
  }

  # Proxy the public Meet API to Django. Without this, browser calls like
  # /api/v1.0/rooms/... are handled by the SPA fallback and return index.html.
  location ^~ /api/ {
      resolver 127.0.0.11 valid=10s ipv6=off;
      set $mastrao_backend http://app-dev:8000;
      proxy_pass $mastrao_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      proxy_set_header X-Original-URL "";
      proxy_set_header X-Real-IP "";
  }

  # Serve static files
  location / {
      try_files $uri $uri/ /index.html;
      # Add no-cache headers
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      add_header Pragma "no-cache";  # HTTP 1.0 header for backward compatibility
      add_header Expires 0;
  }
}
