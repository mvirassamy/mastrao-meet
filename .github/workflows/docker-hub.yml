          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: DOCKER_USER=${{ env.DOCKER_USER }}:-1000
          push: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg commit "${GITHUB_SHA}" --arg workflow "${GITHUB_WORKFLOW}" --arg job "${GITHUB_JOB}" --arg digest "${IMAGE_DIGEST}" --argjson images "$(printf '%s\n' "${IMAGE_TAGS}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{schema: "mastrao.meet.image-publication-proof.v1", repository: ($images[0] | sub(":[^/:]+$"; "")), workflow: $workflow, job: $job, commit: $commit, images: $images, digest: $digest}' > image-publication-proof.json

      - name: Upload sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meet-image-proof-${{ github.job }}
          path: image-publication-proof.json
          if-no-files-found: error
          retention-days: 7

  notify-argocd:
    permissions:
      contents: read
    needs:
      - build-and-push-frontend-generic
      - build-and-push-frontend-dinum
      - build-and-push-backend
      - build-and-push-summary
      - build-and-push-agents
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: numerique-gouv/action-argocd-webhook-notification@main
        id: notify
        with:
          deployment_repo_path: "${{ secrets.DEPLOYMENT_REPO_URL }}"
          argocd_webhook_secret: "${{ secrets.ARGOCD_PREPROD_WEBHOOK_SECRET }}"
          argocd_url: "${{ vars.ARGOCD_PREPROD_WEBHOOK_URL }}"
