name: Docker Hub Workflow
run-name: Docker Hub Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:
    branches:
      - 'main'

permissions:
  contents: read

env:
  DOCKER_USER: 1001:127
  DOCKER_CONTAINER_REGISTRY_HOSTNAME: docker.io
  DOCKER_CONTAINER_REGISTRY_NAMESPACE: lasuite
  IS_MULTI_PLATFORM_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') }}
  BUILD_PLATFORMS: ${{ startsWith(github.ref, 'refs/tags/v') && 'linux/amd64,linux/arm64' || 'linux/amd64' }}

jobs:
  build-and-push-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.2.0
      -
        name: Set up QEMU
        if: env.IS_MULTI_PLATFORM_BUILD == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.11.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/meet-backend'
      -
        name: Login to DockerHub
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      -
        name: Run trivy scan
        uses: numerique-gouv/action-trivy-cache@main
        with:
          docker-build-args: '--target backend-production -f Dockerfile'
          docker-image-name: '${{ env.DOCKER_CONTAINER_REGISTRY_HOSTNAME }}/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/meet-backend:${{ github.sha }}'
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: backend-production
          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: DOCKER_USER=${{ env.DOCKER_USER }}:-1000
          push: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg commit "${GITHUB_SHA}" --arg workflow "${GITHUB_WORKFLOW}" --arg job "${GITHUB_JOB}" --arg digest "${IMAGE_DIGEST}" --argjson images "$(printf '%s\n' "${IMAGE_TAGS}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{schema: "mastrao.meet.image-publication-proof.v1", repository: ($images[0] | sub(":[^/:]+$"; "")), workflow: $workflow, job: $job, commit: $commit, images: $images, digest: $digest}' > image-publication-proof.json

      - name: Upload sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meet-image-proof-${{ github.job }}
          path: image-publication-proof.json
          if-no-files-found: error
          retention-days: 7

  build-and-push-frontend-generic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      -
        name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v6.2.0
      -
        name: Set up QEMU
        if: env.IS_MULTI_PLATFORM_BUILD == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.6.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.11.1
      -
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: '${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/meet-frontend'
      -
        name: Login to DockerHub
        if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}
      -
        name: Run trivy scan
        uses: numerique-gouv/action-trivy-cache@main
        with:
          docker-build-args: '-f src/frontend/Dockerfile --target frontend-production'
          docker-image-name: '${{ env.DOCKER_CONTAINER_REGISTRY_HOSTNAME }}/${{ env.DOCKER_CONTAINER_REGISTRY_NAMESPACE }}/meet-frontend:${{ github.sha }}'
      -
        name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/frontend/Dockerfile
          target: frontend-production
          platforms: ${{ env.BUILD_PLATFORMS }}
          build-args: DOCKER_USER=${{ env.DOCKER_USER }}:-1000
          push: ${{ github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Write sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n --arg commit "${GITHUB_SHA}" --arg workflow "${GITHUB_WORKFLOW}" --arg job "${GITHUB_JOB}" --arg digest "${IMAGE_DIGEST}" --argjson images "$(printf '%s\n' "${IMAGE_TAGS}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{schema: "mastrao.meet.image-publication-proof.v1", repository: ($images[0] | sub(":[^/:]+$"; "")), workflow: $workflow, job: $job, commit: $commit, images: $images, digest: $digest}' > image-publication-proof.json

      - name: Upload sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meet-image-proof-${{ github.job }}
          path: image-publication-proof.json
          if-no-files-found: error
          retention-days: 7

