          set -euo pipefail
          jq -n --arg commit "${GITHUB_SHA}" --arg workflow "${GITHUB_WORKFLOW}" --arg job "${GITHUB_JOB}" --arg digest "${IMAGE_DIGEST}" --argjson images "$(printf '%s\n' "${IMAGE_TAGS}" | jq -Rsc 'split("\n") | map(select(length > 0))')" \
            '{schema: "mastrao.meet.image-publication-proof.v1", repository: ($images[0] | sub(":[^/:]+$"; "")), workflow: $workflow, job: $job, commit: $commit, images: $images, digest: $digest}' > image-publication-proof.json

      - name: Upload sanitized image publication proof
        if: ${{ (github.event_name != 'pull_request' || startsWith(github.head_ref, 'integration/')) && steps.build.outputs.digest != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: meet-image-proof-${{ github.job }}
          path: image-publication-proof.json
          if-no-files-found: error
