name: Prepare Room Audio production evidence

on:
  workflow_dispatch:

concurrency:
  group: room-audio-production-evidence
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepare-evidence:
    if: >-
      github.repository == 'mvirassamy/mastrao-meet' &&
      github.ref == 'refs/heads/develop' &&
      github.ref_protected == true
    runs-on: ubuntu-latest
    environment: room-audio-production-evidence
    strategy:
      fail-fast: false
      matrix:
        role: [meet-agents, meet-backend, metadata-collector, livekit-render]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout trusted evidence tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Select the closed Room Audio candidate
        id: candidate
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -m scripts.ci.room_audio_production_evidence select \
            --role "$ROLE" >> "$GITHUB_OUTPUT"

      - name: Download the original candidate receipt
        if: steps.candidate.outputs.acquisition == 'registry'
        env:
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id="$(python -m scripts.ci.room_audio_production_evidence artifact-id \
            --listing "$RUNNER_TEMP/artifacts.json" \
            --name "$ARTIFACT_NAME")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/candidate-receipt.zip"
          mkdir "$RUNNER_TEMP/candidate-receipt"
          unzip -q "$RUNNER_TEMP/candidate-receipt.zip" -d "$RUNNER_TEMP/candidate-receipt"
          test "$(find "$RUNNER_TEMP/candidate-receipt" -type f | wc -l | tr -d ' ')" = 1
          test -f "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json"

      - name: Download the exact retained OCI archive
        if: steps.candidate.outputs.acquisition == 'retained-archive'
        env:
          ARTIFACT_NAME: ${{ steps.candidate.outputs.artifact_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.candidate.outputs.run_id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > "$RUNNER_TEMP/artifacts.json"
          artifact_id="$(python -m scripts.ci.room_audio_production_evidence artifact-id \
            --listing "$RUNNER_TEMP/artifacts.json" \
            --name "$ARTIFACT_NAME")"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" \
            > "$RUNNER_TEMP/retained-source.zip"
          mkdir "$RUNNER_TEMP/retained-source"
          unzip -q "$RUNNER_TEMP/retained-source.zip" -d "$RUNNER_TEMP/retained-source"

      - name: Verify and materialize the exact retained OCI archive
        if: steps.candidate.outputs.acquisition == 'retained-archive'
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -m scripts.ci.room_audio_production_evidence verify-retained-archive \
            --role "$ROLE" \
            --artifact-directory "$RUNNER_TEMP/retained-source"
          mkdir "$RUNNER_TEMP/candidate-layout" "$RUNNER_TEMP/candidate-receipt"
          cp "$RUNNER_TEMP/retained-source/candidate-receipt.json" \
            "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json"
          tar -xf "$RUNNER_TEMP/retained-source/local-build.tar" \
            -C "$RUNNER_TEMP/candidate-layout"

      - name: Install the approved Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0
          cache: false

      - name: Qualify the Trivy binary before registry authentication
        env:
          EXPECTED_TRIVY_DIGEST: sha256:d89bcc6510a267f11b773398cbf1be5520ce39f9e8b6633178c4487f05b7d791
        run: |
          trivy_binary="$(command -v trivy)"
          test -x "$trivy_binary"
          test "$(trivy --version | awk '$1 == "Version:" {print $2; exit}')" = "0.74.0"
          actual_digest="sha256:$(sha256sum "$trivy_binary" | awk '{print $1}')"
          test "$actual_digest" = "$EXPECTED_TRIVY_DIGEST"

      - name: Require the dedicated read-only registry identity
        if: steps.candidate.outputs.acquisition == 'registry'
        env:
          REGISTRY_PASSWORD: ${{ secrets.MEET_STAGING_REGISTRY_READ_PASSWORD }}
        run: test -n "$REGISTRY_PASSWORD"

      - name: Set up ORAS
        if: steps.candidate.outputs.acquisition == 'registry'
        uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6 # v1
        with:
          version: 1.3.0

      - name: Authenticate to the staging registry for readback
        if: steps.candidate.outputs.acquisition == 'registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: rg.fr-par.scw.cloud/mastrao-staging
          username: nologin
          password: ${{ secrets.MEET_STAGING_REGISTRY_READ_PASSWORD }}

      - name: Copy the exact candidate into a local OCI layout
        if: steps.candidate.outputs.acquisition == 'registry'
        env:
          ROLE: ${{ matrix.role }}
          SOURCE_REFERENCE: ${{ steps.candidate.outputs.source_reference }}
        run: |
          oras cp --to-oci-layout "$SOURCE_REFERENCE" "$RUNNER_TEMP/candidate-layout:$ROLE"

      - name: Remove registry credentials before validation and scan
        if: steps.candidate.outputs.acquisition == 'registry'
        run: docker logout rg.fr-par.scw.cloud/mastrao-staging

      - name: Verify the complete OCI graph and prepare the runtime scan layout
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -m scripts.ci.room_audio_production_evidence inspect \
            --role "$ROLE" \
            --receipt "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json" \
            --layout "$RUNNER_TEMP/candidate-layout" \
            --scan-layout "$RUNNER_TEMP/candidate-scan-layout" \
            --output "$RUNNER_TEMP/oci-graph.json"

      - name: Scan the exact runtime image without publishing
        env:
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          trivy image \
            --cache-dir "$TRIVY_CACHE_DIR" \
            --input "$RUNNER_TEMP/candidate-scan-layout" \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format json \
            --output "$RUNNER_TEMP/trivy-report.json" \
            --exit-code 0
          scanned_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          printf '%s\n' "$scanned_at" > "$RUNNER_TEMP/scanned-at"
          trivy --cache-dir "$TRIVY_CACHE_DIR" version --format json \
            > "$RUNNER_TEMP/trivy-version.json"
          test -f "$TRIVY_CACHE_DIR/db/trivy.db"

      - name: Render the fail-closed scan and provenance evidence
        env:
          ROLE: ${{ matrix.role }}
          TRIVY_CACHE_DIR: ${{ runner.temp }}/trivy-cache
        run: |
          python -m scripts.ci.room_audio_production_evidence render \
            --role "$ROLE" \
            --receipt "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json" \
            --graph "$RUNNER_TEMP/oci-graph.json" \
            --trivy-report "$RUNNER_TEMP/trivy-report.json" \
            --trivy-version "$RUNNER_TEMP/trivy-version.json" \
            --trivy-database "$TRIVY_CACHE_DIR/db/trivy.db" \
            --trivy-binary "$(command -v trivy)" \
            --scanned-at "$(cat "$RUNNER_TEMP/scanned-at")" \
            --output "$RUNNER_TEMP/scan-provenance.json"

      - name: Package the rescanned retained archive and evidence
        if: steps.candidate.outputs.acquisition == 'retained-archive'
        env:
          ROLE: ${{ matrix.role }}
        run: |
          python -m scripts.ci.room_audio_production_evidence package-local-archive \
            --role "$ROLE" \
            --receipt "$RUNNER_TEMP/candidate-receipt/candidate-receipt.json" \
            --graph "$RUNNER_TEMP/oci-graph.json" \
            --scan-provenance "$RUNNER_TEMP/scan-provenance.json" \
            --archive "$RUNNER_TEMP/retained-source/local-build.tar" \
            --artifact-directory "$RUNNER_TEMP/retained-local-archive-artifact"

      - name: Upload registry evidence only
        if: steps.candidate.outputs.acquisition == 'registry'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: room-audio-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/candidate-receipt/candidate-receipt.json
            ${{ runner.temp }}/oci-graph.json
            ${{ runner.temp }}/scan-provenance.json
          if-no-files-found: error
          retention-days: 2

      - name: Upload rescanned retained OCI archive and evidence
        if: steps.candidate.outputs.acquisition == 'retained-archive'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: room-audio-${{ matrix.role }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/retained-local-archive-artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
