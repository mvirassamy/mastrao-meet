name: Publish one Meet staging candidate
run-name: Candidate ${{ inputs.target }} @ ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Image to build and publish without deploying it
        required: true
        type: choice
        options:
          - meet-frontend
          - meet-backend
      source_sha:
        description: Full commit SHA to publish; it must be reachable from develop
        required: true
        type: string

concurrency:
  group: meet-staging-candidate-${{ inputs.target }}-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-candidate:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging-candidates
    steps:
      - name: Validate the selected source shape
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: test "$(printf '%s' "$SOURCE_SHA" | sed -nE '/^[0-9a-f]{40}$/p')" = "$SOURCE_SHA"

      - name: Checkout the selected source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Bind the source to develop and record its immutable tree
        id: source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git fetch --no-tags origin develop
          git merge-base --is-ancestor "$SOURCE_SHA" refs/remotes/origin/develop
          test -z "$(git status --porcelain)"
          source_tree="$(git rev-parse "${SOURCE_SHA}^{tree}")"
          archive_sha256="$(git archive --format=tar "$SOURCE_SHA" | sha256sum | awk '{print $1}')"
          echo "tree=$source_tree" >> "$GITHUB_OUTPUT"
          echo "archive_sha256=$archive_sha256" >> "$GITHUB_OUTPUT"

      - name: Select the closed build recipe
        id: recipe
        env:
          TARGET: ${{ inputs.target }}
        run: |
          case "$TARGET" in
            meet-frontend)
              echo 'dockerfile=src/frontend/Dockerfile' >> "$GITHUB_OUTPUT"
              echo 'build_target=frontend-production' >> "$GITHUB_OUTPUT"
              echo 'repository=rg.fr-par.scw.cloud/mastrao-staging/meet-frontend' >> "$GITHUB_OUTPUT"
              {
                echo 'build_args<<EOF'
                echo 'DOCKER_USER=101:101'
                echo 'VITE_API_BASE_URL=https://meet.mastrao-staging.com'
                echo 'VITE_APP_TITLE=Mastrao Visio'
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            meet-backend)
              echo 'dockerfile=Dockerfile' >> "$GITHUB_OUTPUT"
              echo 'build_target=backend-production' >> "$GITHUB_OUTPUT"
              echo 'repository=rg.fr-par.scw.cloud/mastrao-staging/meet-backend' >> "$GITHUB_OUTPUT"
              {
                echo 'build_args<<EOF'
                echo 'DOCKER_USER=10001:10001'
                echo 'EOF'
              } >> "$GITHUB_OUTPUT"
              ;;
            *) exit 64 ;;
          esac

      - name: Require the dedicated registry publisher
        env:
          REGISTRY_PASSWORD: ${{ secrets.MEET_STAGING_REGISTRY_PASSWORD }}
        run: test -n "$REGISTRY_PASSWORD"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to the staging registry
        uses: docker/login-action@v3
        with:
          registry: rg.fr-par.scw.cloud/mastrao-staging
          username: nologin
          password: ${{ secrets.MEET_STAGING_REGISTRY_PASSWORD }}

      - name: Build and publish the selected candidate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.recipe.outputs.dockerfile }}
          target: ${{ steps.recipe.outputs.build_target }}
          platforms: linux/amd64
          build-args: ${{ steps.recipe.outputs.build_args }}
          push: true
          tags: ${{ steps.recipe.outputs.repository }}:sha-${{ inputs.source_sha }}
          provenance: mode=max
          sbom: true

      - name: Read back the exact candidate from the registry
        env:
          REPOSITORY: ${{ steps.recipe.outputs.repository }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$REPOSITORY@$DIGEST" --raw > candidate-remote-index.json
          python scripts/ci/staging_candidate_readback.py \
            --manifest candidate-remote-index.json \
            --expected-digest "$DIGEST" \
            --output candidate-readback.json

      - name: Render the immutable candidate receipt
        run: |
          python scripts/ci/staging_candidate_receipt.py \
            --target '${{ inputs.target }}' \
            --source-sha '${{ inputs.source_sha }}' \
            --source-tree '${{ steps.source.outputs.tree }}' \
            --source-archive-sha256 '${{ steps.source.outputs.archive_sha256 }}' \
            --digest '${{ steps.build.outputs.digest }}' \
            --readback candidate-readback.json \
            --run-id '${{ github.run_id }}' \
            --run-attempt '${{ github.run_attempt }}' \
            --output candidate-receipt.json

      - name: Upload the candidate receipt
        uses: actions/upload-artifact@v6
        with:
          name: meet-${{ inputs.target }}-${{ inputs.source_sha }}-candidate-receipt
          path: candidate-receipt.json
          if-no-files-found: error
          retention-days: 14
