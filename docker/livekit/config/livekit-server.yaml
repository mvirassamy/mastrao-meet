log_level: debug
redis:
  address: redis:6379
keys:
  devkey: secret

room:
  auto_create: false

# Local development has two WebRTC clients:
# - the real browser on the host, which reaches Docker-published ports through
#   localhost;
# - egress Chrome inside Docker, which shares LiveKit's network namespace in
#   compose and can also reach LiveKit on loopback.
rtc:
  node_ip: 127.0.0.1
  use_external_ip: false
  enable_loopback_candidate: true
  stun_servers: []
  tcp_port: 7881
  udp_port: 7882

webhook:
  api_key: devkey
  urls:
      - http://app-dev:8000/api/v1.0/rooms/webhooks-livekit/
