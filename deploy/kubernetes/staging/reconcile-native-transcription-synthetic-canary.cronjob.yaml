            - name: MASTRAO_RECORDING_EFFECT_ISSUER
              value: mastrao-core-staging
            - name: MASTRAO_RECORDING_EFFECT_AUDIENCE
              value: mastrao-meet-staging
            - name: MASTRAO_RECORDING_EFFECT_KEY_ID
              value: mastrao-staging-core-recording-f8a4963b8cf110b4ff672a9c
            - name: MASTRAO_RECORDING_EFFECT_PUBLIC_JWK
              value: '{"alg":"EdDSA","crv":"Ed25519","kid":"mastrao-staging-core-recording-f8a4963b8cf110b4ff672a9c","kty":"OKP","use":"sig","x":"3T_WT__QwHu7YaP8Q15SZyOzLhTYt9EwyWoEt5Q7-Go"}'
            - name: MASTRAO_RECORDING_RECEIPT_ISSUER
              value: mastrao-meet-staging
            - name: MASTRAO_RECORDING_RECEIPT_AUDIENCE
              value: mastrao-core-staging
            - name: MASTRAO_RECORDING_RECEIPT_KEY_ID
              value: mastrao-staging-meet-recording-receipt-57195bf6a0bd336440b14d04
            - name: MASTRAO_RECORDING_RECEIPT_PRIVATE_JWK
              valueFrom:
                secretKeyRef:
                  key: MASTRAO_RECORDING_RECEIPT_PRIVATE_JWK
                  name: mastrao-meet-recording-receipt-v1
            resources:
              limits:
                cpu: '1'
                memory: 1Gi
              requests:
                cpu: 100m
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
            volumeMounts:
            - mountPath: "/etc/mastrao/postgres"
              name: postgres-ca
              readOnly: true
            - mountPath: "/etc/mastrao/redis"
              name: redis-ca
              readOnly: true
            - mountPath: "/tmp"
              name: tmp
            - mountPath: "/var/lib/mastrao-native-spool"
              name: native-spool
          dnsConfig:
            options:
            - name: ndots
              value: '1'
          dnsPolicy: ClusterFirst
          hostAliases:
          - hostnames:
            - rw-e8b46a5c-1a87-4b0d-87e1-9cab1ef11f39.rdb.fr-par.scw.cloud
            ip: 172.16.8.8
          - hostnames:
            - redis-meet.mastrao-staging.svc.cluster.local
            ip: 10.32.9.61
          imagePullSecrets:
          - name: mastrao-registry-pull-v1
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/hostname: scw-k8s-par-thirsty-cray-capture-00c4bd088b9e4
            mastrao.com/node-pool: capture
          restartPolicy: Never
          securityContext:
            fsGroup: 1000
            runAsGroup: 65534
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          serviceAccountName: worker-native
          terminationGracePeriodSeconds: 90
          tolerations:
          - effect: NoSchedule
            key: mastrao.com/dedicated
            operator: Equal
            value: capture
          volumes:
          - configMap:
              defaultMode: 420
              name: mastrao-core-migration-ca-v1
            name: postgres-ca
          - configMap:
              defaultMode: 420
              name: mastrao-meet-redis-ca-v1
            name: redis-ca
          - emptyDir:
              medium: Memory
              sizeLimit: 64Mi
            name: tmp
          - name: native-spool
            persistentVolumeClaim:
              claimName: native-spool-rwo
