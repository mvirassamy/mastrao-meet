apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconcile-native-transcription
  namespace: mastrao-staging
  labels:
    app.kubernetes.io/name: worker-native
    mastrao.com/component: worker-native
    mastrao.com/role: native-reconciler
spec:
  schedule: "* * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 45
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  suspend: false
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: worker-native
            mastrao.com/component: worker-native
            mastrao.com/role: native-reconciler
        spec:
          automountServiceAccountToken: false
          containers:
          - name: worker-native-reconciler
            image: rg.fr-par.scw.cloud/mastrao-staging/meet-backend@sha256:67d5dba2d14d2e23cd4f82c21861445c1dda9d4a0a225abe77e6890320074b02
            imagePullPolicy: IfNotPresent
            command:
            - "/app/.venv/bin/python"
            - manage.py
            - reconcile_mastrao_recordings
            - "--native-only"
            - "--limit"
            - '2'
            env:
            - name: DJANGO_SETTINGS_MODULE
              value: meet.settings
            - name: DJANGO_CONFIGURATION
              value: Production
            - name: DJANGO_ALLOWED_HOSTS
              value: meet.mastrao-staging.com,meet-api,localhost
            - name: DJANGO_CSRF_TRUSTED_ORIGINS
              value: https://meet.mastrao-staging.com
            - name: APPLICATION_BASE_URL
              value: https://meet.mastrao-staging.com
            - name: MEDIA_BASE_URL
              value: https://meet.mastrao-staging.com
            - name: CELERY_ENABLED
              value: 'True'
            - name: PYTHONDONTWRITEBYTECODE
              value: '1'
            - name: LIVEKIT_API_URL
              value: http://livekit-signal.mastrao-staging.svc.cluster.local:7880
            - name: LIVEKIT_PUBLIC_URL
              value: wss://rtc.mastrao-staging.com
            - name: MASTRAO_PLATFORM_ORIGIN
              value: https://app.mastrao-staging.com
            - name: MASTRAO_ROOM_ADAPTER_ENABLED
              value: 'False'
            - name: MASTRAO_HOST_HANDOFF_ENABLED
              value: 'False'
            - name: MASTRAO_GUEST_INVITATION_ENABLED
              value: 'True'
            - name: MASTRAO_MEETING_CLOSE_ENABLED
              value: 'False'
            - name: MASTRAO_MEETING_RECORDING_ENABLED
              value: 'True'
            - name: MASTRAO_MEETING_RECORDING_START_ENABLED
              value: 'False'
            - name: MASTRAO_MEETING_RECORDING_PRODUCT_EXPOSURE_ENABLED
              value: 'True'
            - name: MASTRAO_MEETING_TRANSCRIPTION_ENABLED
              value: 'False'
            - name: MASTRAO_MEDIA_TOKEN_BINDING_ENABLED
              value: 'True'
            - name: MASTRAO_NATIVE_PREENTRY_ENABLED
              value: 'True'
            - name: MASTRAO_NATIVE_CAPTURE_START_ENABLED
              value: 'True'
            - name: MASTRAO_NATIVE_SOURCE_TRANSFER_ENABLED
              value: 'True'
            - name: MASTRAO_NATIVE_ASR_ENABLED
              value: 'True'
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  key: DJANGO_SECRET_KEY
                  name: mastrao-meet-runtime-v1
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  key: DATABASE_URL
                  name: mastrao-meet-runtime-v1
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  key: CELERY_BROKER_URL
                  name: mastrao-meet-runtime-v1
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  key: REDIS_URL
                  name: mastrao-meet-runtime-v1
            - name: AWS_S3_ENDPOINT_URL
              value: https://s3.fr-par.scw.cloud
            - name: AWS_S3_REGION_NAME
              value: fr-par
            - name: AWS_STORAGE_BUCKET_NAME
              value: mastrao-staging-meet-egress-captures
            - name: AWS_S3_SIGNATURE_VERSION
              value: s3v4
            - name: AWS_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: AWS_S3_ACCESS_KEY_ID
                  name: mastrao-meet-s3-v1
            - name: AWS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  key: AWS_S3_SECRET_ACCESS_KEY
                  name: mastrao-meet-s3-v1
            - name: MASTRAO_NATIVE_CAPTURE_SPOOL_ROOT
              value: "/var/lib/mastrao-native-spool"
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  key: LIVEKIT_API_KEY
                  name: mastrao-livekit-api-v1
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  key: LIVEKIT_API_SECRET
                  name: mastrao-livekit-api-v1
            - name: MASTRAO_NATIVE_ASR_GATEWAY_ENDPOINT
              value: http://asr-gateway:8787/v1/native/transcribe
            - name: MASTRAO_NATIVE_ASR_GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  key: ASR_GATEWAY_AUTH_TOKEN
                  name: mastrao-asr-workload-v1
            - name: MASTRAO_CORE_NATIVE_NOTICE_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/capture/native/notice
            - name: MASTRAO_CORE_NATIVE_OBSERVED_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/capture/native/observed
            - name: MASTRAO_CORE_NATIVE_SOURCE_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/capture/native/source
            - name: MASTRAO_CORE_NATIVE_ASR_PREPARE_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/capture/native/asr/prepare
            - name: MASTRAO_CORE_NATIVE_ASR_RESULT_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/capture/native/asr/result
            - name: MASTRAO_CORE_RECORDING_SESSION_STATUS_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/recording/session-status
            - name: MASTRAO_CORE_RECORDING_DECISION_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/recording/decisions
            - name: MASTRAO_CORE_TRANSCRIPTION_DECISION_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/transcription/decisions
            - name: MASTRAO_CORE_GUEST_REDEMPTION_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/guest-invitations/redeem
            - name: MASTRAO_CORE_GUEST_DECISION_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/guest-admissions/decide
            - name: MASTRAO_CORE_GUEST_CONFIRM_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/guest-admissions/confirm
            - name: MASTRAO_CORE_GUEST_MEDIA_ENDPOINT
              value: http://cabinet-core:8080/internal/v1/meetings/guest-media/authorize
            - name: MASTRAO_RECORDING_NOTICE_VERSION
              value: synthetic_recording_notice_20260915
            - name: MASTRAO_RECORDING_NOTICE_DIGEST
              value: 7ee9704ea65b7ba6dfb327af36bdf049b5fe101917c29a8a269bc6961d984eb4
            - name: MASTRAO_RECORDING_REGION_REF
              value: fr-par
            - name: MASTRAO_RECORDING_STORAGE_BINDING_DIGEST
